# What protocol to use when performing git operations. Supported values: ssh, https
git_protocol: ssh
# What editor gh should run when creating issues, pull requests, etc. If blank, will refer to environment.
editor:
# When to interactively prompt. This is a global config that cannot be overridden by hostname. Supported values: enabled, disabled
prompt: enabled
# A pager program to send command output to, e.g. "less". Set the value to "cat" to disable the pager.
pager: bat --style plain
# Aliases allow you to create nicknames for gh commands
aliases:
  # Fuzzy-pick an open PR and check it out
  co: '!gh pr list -L 200 | fzf --no-preview --reverse | cut -f1 | xargs -r gh pr checkout'
  # Browse issues (gh-issues)
  issues: '!gh-issues "$@"'
  # List current sprint items
  project-sprint: '!gh-sprint list'
  # Pick a sprint item into taskwarrior
  project-sprint-taskwarrior: '!gh-sprint pick'
  # View PR in browser
  pv: pr view --web
  # Create PR, filling title/body from commits
  pc: pr create --fill
  # Show PR status
  ps: pr status
  # View repo in browser
  rw: repo view --web
  # Squash-merge PR and delete branch
  prm: pr merge --squash --delete-branch
  # Watch PR CI checks
  prc: pr checks --watch
  # Show PR diff
  prd: pr diff
  # Mark draft PR ready
  prr: pr ready
  # My open PRs
  mine: pr list --author @me
  # PRs awaiting my review
  rr: 'pr list --search ''review-requested:@me'''
  # Recent workflow runs
  rl: run list -L 10
  # Watch a workflow run
  rwatch: run watch
  # Logs of failed run steps
  rf: run view --log-failed
  # Issues assigned to me
  im: issue list --assignee @me
  # Create issue in browser
  ic: issue create --web
  # List aliases with descriptions
  aliases: '!gh-aliases'
version: "1"
