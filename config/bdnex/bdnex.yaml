config_version: 2
directory: ~/tmp/comics/
library: ~/.local/share/bdnex/bdnex.sqlite
match:
  strong_threshold: 90
  medium_threshold: 70
import:
  mode: in_place
  resume: true
duplicates:
  keys:
  - series
  - volume
  action: ask
write:
  cbr: convert
  pdf: convert
  pdf_mode: auto
  pdf_dpi: 200
  delete_original: ask
  conflict: ask
paths:
  oneshot: OneShot/$language/$title - $authors/$title - $authors
  series: Series/$series/$series - T$volume:02 - $title
  missing_field: ask
  placeholder: Unknown
bedetheque:
  delay:
  - 3
  - 10
  pages_dir: ~/.local/share/bdnex/pages
  fetcher: bdnex.importer.bedetheque:flaresolverr_fetch
  fetcher_endpoint: http://flaresolverr.funkybeefunk.duckdns.org:8191/v1
