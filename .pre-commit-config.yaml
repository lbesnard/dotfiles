# Enabled by ./install (or: ./secrets install-hook). Run on everything: pre-commit run --all-files
# pre-commit also installs the post-merge/post-rewrite hooks (decrypt after git pull).
default_install_hook_types: [pre-commit, post-merge, post-rewrite]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Re-encrypt edited secrets and stage the .age files. Stops the commit once so it contains them; just commit again.
      - id: secrets-encrypt
        name: encrypt secrets (age)
        entry: ./secrets encrypt --stage
        language: system
        always_run: true      # the plaintext is gitignored, so it never appears in the staged file list
        pass_filenames: false
      # Refuse plaintext secrets and non-age *.age files.
      - id: secrets-check
        name: no plaintext secrets staged
        entry: ./secrets check
        language: system
        files: ''
      # After `git pull`, refresh the decrypted files from the new .age files. Silent without a key.
      - id: secrets-decrypt
        name: decrypt secrets after pull
        entry: ./secrets decrypt --hook
        language: system
        stages: [post-merge, post-rewrite]
        always_run: true
        pass_filenames: false
        verbose: true
