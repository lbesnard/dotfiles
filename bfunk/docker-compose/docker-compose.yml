networks:
  proxy:
    name: proxy
    driver: bridge
  frontend:
    ipam:
      config:
      - subnet: $DOCKER_SUBNET_1
services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    command:
    - --providers.docker=true
    - --providers.docker.defaultRule=Host(`{{ index .Labels "com.docker.compose.service"
      }}.${SERVER_DOMAIN}.lan`) || Host(`{{ index .Labels "com.docker.compose.service"
      }}.${SERVER_DOMAIN}.home`) || Host(`{{ index .Labels "com.docker.compose.service"
      }}.${SERVER_DOMAIN}.local`) || Host(`{{ index .Labels "com.docker.compose.service"
      }}.${DUCKDNS_DOMAIN}.duckdns.org`)
    - --entrypoints.web.address=:80
    - --providers.docker.exposedbydefault=false
    - --entrypoints.websecure.address=:443
    - --entrypoints.web.http.redirections.entrypoint.to=websecure
    - --entrypoints.web.http.redirections.entrypoint.scheme=https
    - --entrypoints.web.http.redirections.entrypoint.permanent=true
    - --providers.file.filename=/etc/traefik/dynamic_tls.yml
    - --api.dashboard=true
    - --certificatesresolvers.duckdns.acme.dnschallenge=true
    - --certificatesresolvers.duckdns.acme.dnschallenge.provider=duckdns
    - --certificatesresolvers.duckdns.acme.dnschallenge.disablepropagationcheck=true
    - --certificatesresolvers.duckdns.acme.dnschallenge.delaybeforecheck=120
    - --certificatesresolvers.duckdns.acme.email=$ACME_EMAIL
    - --certificatesresolvers.duckdns.acme.storage=/acme/acme.json
    ports:
    - 80:80
    - 443:443
    dns:
    - $SERVER_LAN_IP
    - 1.1.1.1
    environment:
    - DUCKDNS_TOKEN=$DUCKDNS_TOKEN
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./traefik/certs:/certs:ro
    - ./traefik/acme:/acme
    - ./traefik/dynamic_tls.yml:/etc/traefik/dynamic_tls.yml:ro
    networks:
    - proxy
    - frontend
    restart: unless-stopped
    labels:
    - traefik.enable=true
    - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DUCKDNS_DOMAIN}.duckdns.org`)
    - traefik.http.routers.traefik-dashboard.entrypoints=websecure
    - traefik.http.routers.traefik-dashboard.service=api@internal
    - traefik.http.routers.traefik-dashboard.tls.certresolver=duckdns
    - traefik.http.routers.traefik-dashboard.tls.domains[0].main=${DUCKDNS_DOMAIN}.duckdns.org
    - traefik.http.routers.traefik-dashboard.tls.domains[0].sans=*.${DUCKDNS_DOMAIN}.duckdns.org
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole
    ports:
    - 53:53/tcp
    - 53:53/udp
    - 455:80/tcp
    environment:
      TZ: $TZ
      FTLCONF_dns_listeningMode: all
      FTLCONF_webserver_api_password: $PIHOLE_PWD
    volumes:
    - $DOCKER_CONFIG_PATH/pihole_v6/etc/pihole/:/etc/pihole/
    - $DOCKER_CONFIG_PATH/pihole_v6/etc-dnsmasq.d/:/etc/dnsmasq.d/
    cap_add:
    - SYS_NICE
    networks:
      proxy: {}
      frontend:
        ipv4_address: $PIHOLE_DOCKER_SUB_IP_DNS
    restart: always
    depends_on:
    - traefik
    labels:
    - traefik.enable=true
    - traefik.http.routers.pihole.entrypoints=websecure
    - traefik.http.routers.pihole.tls=true
    - traefik.http.services.pihole.loadbalancer.server.port=80
  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:latest
    container_name: crowdsec
    environment:
    - GID="${GID-1000}"
    - COLLECTIONS=crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/whitelist-good-actors
      crowdsecurity/linux
    - CUSTOM_HOSTNAME=brownfunk
    volumes:
    - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml
    - $DOCKER_CONFIG_PATH/crowdsec2/data:/var/lib/crowdsec/data/
    - /var/log:/var/log:ro
    networks:
      frontend: null
      proxy: null
    ports:
    - 8890:8080
    - 8891:6060
    restart: unless-stopped
    security_opt:
    - no-new-privileges=true
    labels:
      traefik.enable: 'true'
      traefik.http.routers.crowdsec.entrypoints: websecure
      traefik.http.routers.crowdsec.tls: 'true'
      traefik.http.services.crowdsec.loadbalancer.server.port: '8080'
  mariadb:
    image: lscr.io/linuxserver/mariadb:latest
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
    - TZ=$TZ
    - MYSQL_DATABASE=$DB_PIWIGO_SCHEMA
    - MYSQL_USER=$DB_PIWIGO_USER
    - MYSQL_PASSWORD=$DB_PIWIGO_PASS
    volumes:
    - $DOCKER_CONFIG_PATH/mariadb:/config
    ports:
    - ${DB_PORT}:3306
    restart: always
    networks:
      frontend: null
  phpmyadmin:
    image: lscr.io/linuxserver/phpmyadmin:latest
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - PMA_ARBITRARY=1
    volumes:
    - $DOCKER_CONFIG_PATH/phpmyadmin:/config
    ports:
    - 3002:80
    restart: unless-stopped
    networks:
      frontend: null
      proxy: null
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    labels:
      traefik.enable: 'true'
      traefik.http.routers.phpmyadmin.entrypoints: websecure
      traefik.http.routers.phpmyadmin.tls: 'true'
      traefik.http.services.phpmyadmin.loadbalancer.server.port: '80'
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    environment:
      WATCHTOWER_LABEL_ENABLE: 1
      WATCHTOWER_CLEANUP: 'true'
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    command: --interval 3600
    labels:
      com.centurylinklabs.watchtower.enable: true
  unmanic:
    container_name: unmanic
    image: josh5/unmanic:latest
    ports:
    - 8877:8888
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    volumes:
    - $DOCKER_CONFIG_PATH/unmanic:/config
    - $MOVIES_FR_PATH:/library_french
    - /media/lbesnard/bfunk_10tb_1/tmp:/tmp/unmanic
    labels:
      traefik.enable: 'true'
      traefik.http.routers.unmanic.entrypoints: websecure
      traefik.http.routers.unmanic.tls: 'true'
      traefik.http.services.unmanic.loadbalancer.server.port: '8888'
    networks:
      proxy: null
  jellyfin:
    image: linuxserver/jellyfin
    container_name: jellyfin
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=${TZ}
    - UMASK=022
    - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    - WATCHTOWER_CLEANUP=true
    volumes:
    - $JELLYFIN_DATA_PATH/:/config
    - ${TV_SHOWS_PATH}:/data/tvshows:ro
    - $TV_SHOWS_PATH/tubesync-downloads/video:/data/youtube:ro
    - $MOVIES_PATH:/data/movies:ro
    - $MOVIES_FR_PATH:/data/movies_french:ro
    - $MOVIES_SPORT_PATH:/data/movies_adventure_sports:ro
    - $YOGA_GLO_PATH:/data/yoga_glo:ro
    - $GUITAR_VIDEOS_PATH:/data/guitar:ro
    ports:
    - 8096:8096
    - 7359:7359/udp
    - 1900:1900/udp
    devices:
    - /dev/dri:/dev/dri
    restart: unless-stopped
    labels:
    - traefik.enable=true
    - traefik.http.routers.jellyfin.entrypoints=websecure
    - traefik.http.routers.jellyfin.tls=true
    - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    networks:
    - proxy
    - frontend
  navidrome:
    image: deluan/navidrome
    user: $PUID_USER:$PGID_USER
    ports:
    - 8082:4533
    restart: unless-stopped
    environment:
      ND_SCANINTERVAL: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ''
      ND_AUTOIMPORTPLAYLISTS: 'true'
      ND_RECENTLYADDEDBYMODTIME: 'true'
      ND_LASTFM_APIKEY: $LASTFM_API
      ND_LASTFM_SECRET: $LASTFM_SECRET
      ND_SPOTIFY_ID: $SPOTIFY_ID
      ND_SPOTIFY_SECRET: $SPOTIFY_SECRET
      ND_ENABLETRANSCODINGCONFIG: 'true'
      ND_SCANNER_GROUPALBUMRELEASES: 'true'
      ND_ENABLE_ARTWORKPRECACHE: 'true'
      ND_ENABLE_FAVOURITES: 'true'
      ND_ENABLEGRAVATAR: 'true'
      WATCHTOWER_CLEANUP: 'true'
    volumes:
    - $DOCKER_CONFIG_PATH/navidrome:/data
    - $MUSIC_PATH:/music:ro
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.navidrome.entrypoints: websecure
      traefik.http.routers.navidrome.tls: 'true'
      traefik.http.services.navidrome.loadbalancer.server.port: '4533'
  calibre:
    image: linuxserver/calibre
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=${TZ}
    - WATCHTOWER_CLEANUP=true
    volumes:
    - $EBOOKS_PATH:/config
    - $SHARE_PATH:/share
    - $TORRENT_PATH:/torrent
    - $DOCKER_CONFIG_PATH/firefox/Downloads:/firefox
    ports:
    - 7080:8080
    - 8081:8081
    - 8181:8181
    security_opt:
    - seccomp:unconfined
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.calibre.entrypoints: websecure
      traefik.http.routers.calibre.tls: 'true'
      traefik.http.services.calibre.loadbalancer.server.port: '8080'
    networks:
      proxy: null
  calibre-web:
    image: linuxserver/calibre-web
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=${TZ}
    - DOCKER_MODS=linuxserver/mods:universal-calibre
    - WATCHTOWER_CLEANUP=true
    volumes:
    - $DOCKER_CONFIG_PATH/calibre-web:/config
    - $EBOOKS_PATH:/books:ro
    ports:
    - 8083:8083
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.calibre-web.entrypoints: websecure
      traefik.http.routers.calibre-web.tls: 'true'
      traefik.http.services.calibre-web.loadbalancer.server.port: '8083'
    networks:
      proxy: null
  homer:
    image: b4bz/homer:latest
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=${TZ}
    - WATCHTOWER_CLEANUP=true
    volumes:
    - ./homer/config.yml:/www/config.yml
    - ./homer/local/assets/:/www/assets
    ports:
    - 8080:8080
    restart: unless-stopped
    labels:
    - traefik.enable=true
    - traefik.http.routers.homer.rule=Host(`home.${SERVER_DOMAIN}.lan`) || Host(`home.${SERVER_DOMAIN}.home`) || Host(`home.${SERVER_DOMAIN}.local`) || Host(`home.${DUCKDNS_DOMAIN}.duckdns.org`)
    - traefik.http.routers.homer.entrypoints=websecure
    - traefik.http.routers.homer.tls=true
    - traefik.http.services.homer.loadbalancer.server.port=8080
    networks:
    - proxy
    - frontend
    depends_on:
    - pihole
    - tecmint-web
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:34.0.0-ls435
    container_name: nextcloud
    environment:
    - WATCHTOWER_CLEANUP=true
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - DOCKER_MODS=ghcr.io/linuxserver/mods:nextcloud-mediadc|linuxserver/mods:universal-package-install
    - INSTALL_PACKAGES=ffmpeg
    labels:
      traefik.enable: 'true'
      traefik.http.routers.nextcloud.entrypoints: websecure
      traefik.http.routers.nextcloud.tls: 'true'
      traefik.http.services.nextcloud.loadbalancer.server.port: '443'
    volumes:
    - $DOCKER_CONFIG_PATH/nextcloud:/config
    - $NEXTCLOUD_DATA_PATH:/data
    ports:
    - 9393:443
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    depends_on:
    - pihole
    - mariadb
    - redis
    healthcheck:
      test: curl --insecure --fail "https://brownfunk.lan:9393/login" || exit 1
      interval: 2m
      retries: 10
      start_period: 10m
      timeout: 5s
    restart: unless-stopped
  piwigo:
    image: linuxserver/piwigo
    environment:
    - WATCHTOWER_CLEANUP=true
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - DOCKER_MODS=linuxserver/mods:universal-package-install
    - INSTALL_PACKAGES=ffmpeg
    volumes:
    - $PIWIGO_CONFIG_PATH/piwigo:/config
    ports:
    - 8282:80
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.piwigo.entrypoints: websecure
      traefik.http.routers.piwigo.tls: 'true'
      traefik.http.services.piwigo.loadbalancer.server.port: '80'
  radarr:
    image: linuxserver/radarr
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - UMASK=022
    - WATCHTOWER_CLEANUP=true
    volumes:
    - $DOCKER_CONFIG_PATH/radarr:/config
    - $MOVIES_ENG_PATH:/movies
    - $TORRENT_PATH/downloads/movies:/downloads/movies
    - $TORRENT_PATH/data/movies:/data/completed
    ports:
    - 7878:7878
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    depends_on:
    - pihole
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.radarr.entrypoints: websecure
      traefik.http.routers.radarr.tls: 'true'
      traefik.http.services.radarr.loadbalancer.server.port: '7878'
  radarr_fr:
    image: linuxserver/radarr
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - UMASK=022
    - WATCHTOWER_CLEANUP=true
    volumes:
    - $DOCKER_CONFIG_PATH/radarr_fr:/config
    - $MOVIES_FR_PATH:/movies
    - $TORRENT_PATH/data/movies_fr:/data/completed
    ports:
    - 7879:7878
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    depends_on:
    - pihole
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.radarr_fr.entrypoints: websecure
      traefik.http.routers.radarr_fr.tls: 'true'
      traefik.http.services.radarr_fr.loadbalancer.server.port: '7878'
  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr
    restart: always
    environment:
      TZ: $TZ
      PUID: 1000
      PGID: 1000
    volumes:
    - $DOCKER_CONFIG_PATH/decluttarr/:/app/config/
    - ${TV_SHOWS_PATH}:/tv
    - $MOVIES_ENG_PATH:/movies
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
    - frontend
    depends_on:
    - pihole
  sonarr:
    image: linuxserver/sonarr:4.0.14
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - UMASK=022
    - WATCHTOWER_CLEANUP=true
    volumes:
    - $DOCKER_CONFIG_PATH/sonarr:/config
    - ${TV_SHOWS_PATH}:/tv
    - $TORRENT_PATH/data/shows:/data/completed
    ports:
    - 8989:8989
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    depends_on:
    - pihole
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.sonarr.entrypoints: websecure
      traefik.http.routers.sonarr.tls: 'true'
      traefik.http.services.sonarr.loadbalancer.server.port: '8989'
  jackett:
    image: linuxserver/jackett
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - AUTO_UPDATE=true
    - WATCHTOWER_CLEANUP=true
    volumes:
    - $DOCKER_CONFIG_PATH/jackett:/config
    - $TORRENT_PATH:/downloads
    ports:
    - 9117:9117
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    depends_on:
    - pihole
    - flaresolverr
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.jackett.entrypoints: websecure
      traefik.http.routers.jackett.tls: 'true'
      traefik.http.services.jackett.loadbalancer.server.port: '9117'
  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=$TZ
    - AUTO_UPDATE=true
    - WATCHTOWER_CLEANUP=true
    volumes:
    - $DOCKER_CONFIG_PATH/prowlarr:/config
    ports:
    - 9696:9696
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    depends_on:
    - pihole
    - flaresolverr
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.prowlarr.entrypoints: websecure
      traefik.http.routers.prowlarr.tls: 'true'
      traefik.http.services.prowlarr.loadbalancer.server.port: '9696'
    restart: unless-stopped
  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - LOG_HTML=${LOG_HTML:-false}
    - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - WATCHTOWER_CLEANUP=true
    dns:
    - 1.1.1.1
    - 8.8.8.8
    - $SERVER_LAN_IP
    depends_on:
    - pihole
    ports:
    - 8191:8191
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: true
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
    - NET_ADMIN
    dns:
    - 1.1.1.1
    - 8.8.8.8
    devices:
    - /dev/net/tun:/dev/net/tun
    ports:
    - 8888:8888/tcp
    - 8388:8388/tcp
    - 8388:8388/udp
    - 9091:9091
    - 51413:51413
    - 29051:29051
    - 51414:51413/udp
    volumes:
    - $DOCKER_CONFIG_PATH/gluetun:/gluetun
    environment:
    - VPN_PORT_FORWARDING=true
    - VPN_PORT_FORWARDING_PROVIDER="private internet access"
    - VPN_SERVICE_PROVIDER=pia
    - VPN_TYPE=openvpn
    - OPENVPN_USER=$PIA_USERNAME
    - OPENVPN_PASSWORD=$PIA_PASSWORD
    - SERVER_REGIONS=Netherlands,Germany,Switzerland
    - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c "/gluetun/set-transmission-port.sh
      {{PORT}}"
    - TZ=$TZ
    - UPDATER_PERIOD=24h
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    network_mode: service:gluetun
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - DOCKER_MODS=linuxserver/mods:transmission-trguing
    volumes:
    - $TORRENT_PATH/downloads:/downloads
    - $TORRENT_PATH/data:/data
    - $TORRENT_PATH/config:/config
    - $TORRENT_PATH/watch:/watch
    restart: unless-stopped
  tecmint-web:
    image: httpd:2.4
    ports:
    - 1021:80
    volumes:
    - $DOCKER_CONFIG_PATH/howto:/usr/local/apache2/htdocs/
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      traefik.http.routers.tecmint-web.entrypoints: websecure
      traefik.http.routers.tecmint-web.tls: 'true'
      traefik.http.services.tecmint-web.loadbalancer.server.port: '80'
    networks:
      proxy: null
  hedgedoc:
    image: ghcr.io/linuxserver/hedgedoc:latest
    volumes:
    - $DOCKER_CONFIG_PATH/codimd:/config
    environment:
    - DB_HOST=$DB_HOST
    - DB_USER=$DB_CODIMD_USER
    - DB_PASS=$DB_CODIMD_PASS
    - DB_NAME=$DB_CODIMD_SCHEMA
    - CMD_DOMAIN=$DB_HOST
    - CMD_URL_ADDPORT=true
    - DB_PORT=$DB_PORT
    - PGID=$PGID_USER
    - PUID=$PUID_USER
    - TZ=$TZ
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    depends_on:
    - pihole
    - mariadb
    restart: unless-stopped
    ports:
    - 3000:3000
    labels:
      traefik.enable: 'true'
      traefik.http.routers.hedgedoc.entrypoints: websecure
      traefik.http.routers.hedgedoc.tls: 'true'
      traefik.http.services.hedgedoc.loadbalancer.server.port: '3000'
  duckdns:
    image: linuxserver/duckdns
    dns: 1.1.1.1
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - SUBDOMAINS=$DUCKDNS_DOMAIN
    - TOKEN=$DUCKDNS_TOKEN
    - LOG_FILE=false
    volumes:
    - $DOCKER_CONFIG_PATH/duckdns:/config
    restart: always
  # swag: disabled - superseded by Traefik (v3.6, above), which now handles
  # reverse-proxying + Let's Encrypt for all services. Kept here for reference
  # in case swag-specific features (e.g. crowdsec bouncer mod) are needed again.
  # swag:
  #   image: ghcr.io/linuxserver/swag
  #   cap_add:
  #   - NET_ADMIN
  #   dns:
  #   - $PIHOLE_DOCKER_SUB_IP_DNS
  #   networks:
  #   - frontend
  #   environment:
  #   - PUID=$PUID_USER
  #   - PGID=$PGID_USER
  #   - TZ=Europe/Brussels
  #   - URL=$DUCKDNS_DOMAIN.duckdns.org
  #   - SUBDOMAINS=wildcard
  #   - VALIDATION=duckdns
  #   - DUCKDNSTOKEN=$DUCKDNS_TOKEN
  #   - ONLY_SUBDOMAINS=false
  #   - STAGING=false
  #   - DOCKER_MODS=ghcr.io/linuxserver/mods:swag-crowdsec
  #   - CROWDSEC_API_KEY=${CROWDSEC_SWAG_API_KEY}
  #   - CROWDSEC_LAPI_URL=http://crowdsec:8080
  #   volumes:
  #   - $DOCKER_CONFIG_PATH/swag:/config
  #   ports:
  #   - 443:443
  #   - 555:80
  #   restart: unless-stopped
  redis:
    image: redis:alpine
    ports:
    - 6379:6379
    restart: unless-stopped
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - WATCHTOWER_CLEANUP=true
    - TZ=$TZ
    labels:
      com.centurylinklabs.watchtower.enable: true
  portainer:
    image: portainer/portainer-ce
    environment:
    - WATCHTOWER_CLEANUP=true
    ports:
    - 6767:8000
    - 6263:9000
    - 9443:9433
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - $DOCKER_CONFIG_PATH/portainer:/data
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.portainer.entrypoints: websecure
      traefik.http.routers.portainer.tls: 'true'
      traefik.http.services.portainer.loadbalancer.server.port: '8000'
    networks:
      proxy: null
  wordpress:
    image: wordpress:5-php7.4-apache
    ports:
    - 5555:80
    environment:
      WORDPRESS_DB_HOST: $DB_WP_URL
      WORDPRESS_DB_USER: $DB_WP_USER
      WORDPRESS_DB_PASSWORD: $DB_WP_PASS
      WORDPRESS_DB_NAME: $DB_WP_SCHEMA
      PUID: 1000
      PGID: 1000
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    depends_on:
    - pihole
    - mariadb
    restart: unless-stopped
    volumes:
    - $DOCKER_CONFIG_PATH/wordpress:/var/www/html
    labels:
      traefik.enable: 'true'
      traefik.http.routers.wordpress.entrypoints: websecure
      traefik.http.routers.wordpress.tls: 'true'
      traefik.http.services.wordpress.loadbalancer.server.port: '80'
  wordpress_diary:
    image: wordpress:6.2.0-php8.2-apache
    ports:
    - 5556:80
    depends_on:
    - mariadb
    - pihole
    environment:
      WORDPRESS_DB_HOST: $DB_WP_URL
      WORDPRESS_DB_USER: $DB_WP_USER
      WORDPRESS_DB_PASSWORD: $DB_WP_PASS
      WORDPRESS_DB_NAME: $DB_WP_DIARY_SCHEMA
      WATCHTOWER_CLEANUP: 'true'
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    restart: unless-stopped
    volumes:
    - $DOCKER_CONFIG_PATH/wordpress_diary:/var/www/html
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.wordpress_diary.entrypoints: websecure
      traefik.http.routers.wordpress_diary.tls: 'true'
      traefik.http.services.wordpress_diary.loadbalancer.server.port: '80'
  bazarr:
    image: linuxserver/bazarr
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - WATCHTOWER_CLEANUP=true
    - UMASK_SET=022
    volumes:
    - $DOCKER_CONFIG_PATH/bazarr:/config
    - $MOVIES_ENG_PATH:/movies
    - $TV_SHOWS_PATH:/tv
    depends_on:
    - pihole
    ports:
    - 6768:6767
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.bazarr.entrypoints: websecure
      traefik.http.routers.bazarr.tls: 'true'
      traefik.http.services.bazarr.loadbalancer.server.port: '6767'
    dns:
    - $PIHOLE_DOCKER_SUB_IP_DNS
    networks:
      frontend: null
      proxy: null
    restart: unless-stopped
  komga:
    image: gotson/komga
    volumes:
    - type: bind
      source: $DOCKER_CONFIG_PATH/komga
      target: /config
    - type: bind
      source: $COMICS_PATH/
      target: /books
      read_only: true
    - type: bind
      source: $MAGAZINES_PATH/
      target: /magazines
      read_only: true
    - type: bind
      source: /etc/timezone
      target: /etc/timezone
      read_only: true
    ports:
    - 9981:25600
    user: $PUID_USER:$PGID_USER
    environment:
    - JAVA_TOOL_OPTIONS=-Xmx6g
    - KOMGA_LIBRARIES_SCAN_STARTUP=false
    - KOMGA_LIBRARIES_SCAN_CRON=0 0 */4 * * ?
    - WATCHTOWER_CLEANUP=true
    restart: always
    networks:
      frontend: null
      proxy: null
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.komga.entrypoints: websecure
      traefik.http.routers.komga.tls: 'true'
      traefik.http.services.komga.loadbalancer.server.port: '25600'
  wireguard:
    image: linuxserver/wireguard
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - SERVERURL=${DUCKDNS_DOMAIN}.duckdns.org
    - SERVERPORT=51820
    - PEERS=$WG2_PEERS
    - PEERDNS=auto
    - INTERNAL_SUBNET=10.13.13.0
    volumes:
    - $DOCKER_CONFIG_PATH/wireguard/config:/config
    - /lib/modules:/lib/modules
    - /usr/src/:/usr/src
    ports:
    - 51820:51820/udp
    restart: always
    depends_on:
    - duckdns
  wireguard2:
    image: linuxserver/wireguard
    cap_add:
    - NET_ADMIN
    - SYS_MODULE
    environment:
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - SERVERURL=${DUCKDNS_DOMAIN}.duckdns.org
    - SERVERPORT=51821
    - PEERS=$WG2_PEERS
    - PEERDNS=$PIHOLE_DOCKER_SUB_IP_DNS
    - INTERNAL_SUBNET=10.13.13.0
    volumes:
    - $DOCKER_CONFIG_PATH/wireguard2/config:/config
    - /lib/modules:/lib/modules
    - /usr/src/:/usr/src
    depends_on:
    - pihole
    - duckdns
    ports:
    - 51821:51820/udp
    networks:
    - frontend
    restart: always
  rsync-server:
    image: quentintin/rsync-server
    volumes:
    - $HOME/.ssh/id_rsa.pub:/root/.ssh/authorized_keys
    - $EBOOKS_AUDIOBOOKS_PATH:/data/ebooks_audiobooks:ro
    - $EBOOKS_FR_PATH:/data/ebooks_fr:ro
    - $GAMES_PATH:/data/games:ro
    - $PS4_PATH:/data/PS4:ro
    - $MOVIES_PATH:/data/movies:ro
    - $MOVIES_FR_PATH:/data/Movies(French):ro
    - $MOVIES_SPORT_PATH:/data/Sport:ro
    - $TV_SHOWS_PATH:/data/TV Shows:ro
    - $MUSIC_ROOT_PATH:/data/music:ro
    - $PICTURES_PATH:/data/pictures:ro
    - $PIWIGO_CONFIG_PATH/piwigo/www/gallery/upload:/data/pictures_piwigo:ro
    - $SHARE_PATH:/data/share:ro
    - $TORRENT_PATH:/data/torrent:ro
    - $SELF_IMPROVEMENT_PATH:/data/self_improvement:ro
    - $PODCASTS_PATH:/data/podcasts:ro
    - $DOCKER_CONFIG_PATH:/data/docker:ro
    - $NEXTCLOUD_DATA_PATH:/data/nextcloud:ro
    - $TORRENT_PATH/data/games:/data/games_torrent:ro
    environment:
      PUID: $PUID_USER
      PGID: $PGID_USER
    networks:
      frontend: null
    ports:
    - '9000:22'
    restart: always
  samba:
    image: dperson/samba
    container_name: samba
    environment:
      TZ: $TZ
      PUID: $PUID_USER
      PGID: $PGID_USER
    ports:
    - 139:139/tcp
    - 445:445/tcp
    read_only: true
    tmpfs:
    - /tmp
    restart: always
    stdin_open: true
    tty: true
    volumes:
    - $EBOOKS_AUDIOBOOKS_PATH:/share1:ro
    - $GAMES_PATH:/share2:ro
    - $MOVIES_PATH:/share3:ro
    - $MUSIC_PATH:/share4:ro
    - $PICTURES_PATH:/share5
    - $SHARE_PATH:/share6
    - $TORRENT_PATH:/share7:ro
    - $SELF_IMPROVEMENT_PATH:/share8:ro
    - $PODCASTS_PATH:/share9:ro
    - $TV_SHOWS_PATH:/share10:ro
    command: '-s "Ebooks;/share1;yes;yes;yes;all;none;$USER;ebooks share ro"

      -s "Games;/share2;yes;yes;yes;all;none;$USER;games share ro"

      -s "Movies;/share3;yes;yes;yes;all;none;$USER;movies share ro"

      -s "Shows;/share10;yes;yes;yes;all;none;$USER;shows share ro"

      -s "Music;/share4;yes;yes;yes;all;none;$USER;music share ro"

      -s "Pictures;/share5;yes;no;no;$USER;$USER;$USER;pictures ro except user"

      -s "Shared;/share6;yes;no;yes;guest,$USER;guest,$USER;guest,$USER;shared rw"

      -s "Torrent;/share7;yes;yes;yes;all;none;$USER;torrent share ro"

      -s "Self Improvement;/share8;yes;yes;yes;all;none;$USER;Self Improvement share
      ro"

      -s "Podcasts;/share9;yes;yes;yes;all;none;$USER;Podcasts share ro"

      -u "$USER;$SAMBA_PASSWORD"

      -u "guest;guest"

      -g "map to guest = Bad User"

      -g "guest account = nobody"

      '
  filebrowserquantum:
    image: gtstef/filebrowser:latest
    container_name: filebrowserquantum
    environment:
    - FILEBROWSER_CONFIG=/data/config.yaml
    - TZ=$TZ
    - WATCHTOWER_CLEANUP=true
    user: ${PUID_USER}:${PGID_USER}
    ports:
    - 9295:80
    volumes:
    - $DOCKER_CONFIG_PATH/filebrowserquantum/data:/data
    - $EBOOKS_AUDIOBOOKS_PATH:/srv/media/ebooks_audiobooks:ro
    - $MUSIC_PATH:/srv/media/music:ro
    - $MOVIES_PATH:/srv/media/movies:ro
    - $TV_SHOWS_PATH:/srv/media/tv_shows:ro
    - $TORRENT_PATH:/srv/media/torrent:ro
    - $SELF_IMPROVEMENT_PATH:/srv/media/self_improvement:ro
    - $GAMES_PATH:/srv/media/games:ro
    - $SHARE_PATH:/srv/media/share
    restart: unless-stopped
    labels:
    - traefik.enable=true
    - traefik.http.routers.filebrowser.rule=Host(`filebrowser.${SERVER_DOMAIN}.lan`) || Host(`filebrowser.${SERVER_DOMAIN}.home`) || Host(`filebrowser.${SERVER_DOMAIN}.local`) || Host(`filebrowser.${DUCKDNS_DOMAIN}.duckdns.org`)
    - traefik.http.routers.filebrowser.entrypoints=websecure
    - traefik.http.routers.filebrowser.tls=true
    - traefik.http.services.filebrowser.loadbalancer.server.port=80
    networks:
    - proxy
    - frontend
  firefox:
    image: lscr.io/linuxserver/firefox:latest
    security_opt:
    - seccomp:unconfined
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=$TZ
    volumes:
    - $DOCKER_CONFIG_PATH/firefox:/config
    ports:
    - 3008:3000
    - 3001:3001
    shm_size: 1gb
    restart: unless-stopped
    labels:
      traefik.enable: 'true'
      traefik.http.routers.firefox.entrypoints: websecure
      traefik.http.routers.firefox.tls: 'true'
      traefik.http.services.firefox.loadbalancer.server.port: '3000'
    networks:
      proxy: null
  taskchampion:
    image: ghcr.io/gothenburgbitfactory/taskchampion-sync-server:0.7.1
    container_name: taskchampion
    restart: always
    environment:
    - LISTEN=0.0.0.0:9000
    ports:
    - 9008:9000
    volumes:
    - $DOCKER_CONFIG_PATH/taskchampion:/var/lib/taskchampion-sync-server
    labels:
      traefik.enable: 'true'
      traefik.http.routers.taskchampion.entrypoints: websecure
      traefik.http.routers.taskchampion.tls: 'true'
      traefik.http.services.taskchampion.loadbalancer.server.port: '9000'
    networks:
      proxy: null
  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    cap_add:
    - SYS_RAWIO
    ports:
    - 8033:8080
    - 8086:8086
    volumes:
    - /run/udev:/run/udev:ro
    - $DOCKER_CONFIG_PATH/scrutiny/config:/opt/scrutiny/config
    - $DOCKER_CONFIG_PATH/scrutiny/influxdb:/opt/scrutiny/influxdb
    devices:
    - /dev/sdc
    - /dev/sdd
    - /dev/sde
    - /dev/sdb
    environment:
    - COLLECTOR_CRON_SCHEDULE="*/5 * * * *"
    - PUID=$PUID_USER
    - PGID=$PGID_USER
    - TZ=$TZ
    - WATCHTOWER_CLEANUP=true
    labels:
      com.centurylinklabs.watchtower.enable: true
      traefik.enable: 'true'
      traefik.http.routers.scrutiny.entrypoints: websecure
      traefik.http.routers.scrutiny.tls: 'true'
      traefik.http.services.scrutiny.loadbalancer.server.port: '8080'
    restart: unless-stopped
    networks:
      proxy: null
