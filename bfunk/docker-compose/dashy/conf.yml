# Dashy Configuration - Converted from Homer config
# Full docs here: https://dashy.to/docs/configuring

pageInfo:
  title: Brownfunk Dashboard
  description: Local Services & Infrastructure
  navLinks:
    - title: Server Howto
      path: http://hedgedoc.funkybrownfunk.duckdns.org/s/H1tA_LShH
      target: newtab
    - title: Brownfunk Homepage
      path: http://home.funkybrownfunk.duckdns.org
      target: newtab
    - title: Beefunk Homepage
      path: http://home.funkybeefunk.duckdns.org
      target: newtab
  footer: |
    Created with ❤️ | <a href="http://hedgedoc.funkybrownfunk.duckdns.org/s/H1tA_LShH" target="_blank">Server Howto</a>

appConfig:
  # theme: material-dark
  theme: nord
  statusCheck: true
  statusCheckInterval: 100
  statusCheckAccessibility: true
  pingCheckEnabled: true
  pingCheckInterval: 100
  pingCheckAccessibility: true
  defaultOpeningMethod: newtab
  language: en
  webSearch:
    searchEngine: 'duckduckgo'
    openingMethod: 'newtab'
    searchBangs:
      /r: reddit
      /w: wikipedia
      /s: https://whoogle.local/search?q=
      /a: https://www.amazon.co.uk/s?k=
      ':wolf': wolframalpha
      ':so': stackoverflow
      ':git': github

sections:
  - name: home-widgets
    widgets:
    #   - type: 'custom-search'
    #     options:
    #       placeholder: Search for something using the buttons below
    #       engines:
    #       - title: Quant
    #         url: https://www.qwant.com/?q=
      - type: clock
        options:
          timezone: Australia/Hobart

      - type: public-holidays
        options:
          country: AU
          state: TAS 
          holidayType: all
          monthsToShow: 2
          lang: en
      - type: xkcd-comic
        options:
          comic: latest
      - type: chucknorris
      - type: apod


  - name: Media Streaming
    icon: fas fa-film

    items:
      - title: Music
        description: Navidrome - music streaming
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/navidrome.png
        url: http://navidrome.funkybrownfunk.duckdns.org
