- shell:
    - [
        "[[ -d ~/Downloads ]] || mkdir -p ~/Downloads",
        Creating downloads directory,
      ]
- clean: ["~"]
- link:
    ~/.alias: { force: true, path: alias, create: true }
    ~/.alias_forgit: { force: true, path: alias_forgit, create: true }
    ~/.alias_gaming: { force: true, path: alias_gaming, create: true }
    ~/.alias_netcdf: { force: true, path: alias_netcdf, create: true }
    ~/.alias_sync: { force: true, path: alias_sync, create: true }
    ~/.alias_taskwarrior: { force: true, path: alias_taskwarrior, create: true }
    ~/.ansible.cfg: { force: true, path: ansible.cfg, create: true }
    ~/.aws: { create: true, force: true, path: aws/ }
    ~/.bashrc: { force: true, path: bashrc }
    ~/.bash_profile: { force: true, path: bash_profile }
    ~/.cheat: { create: true, force: true, path: cheat/ }
    ~/.cmus/cmus-tmux-statusbar.sh:
      { create: true, path: cmus/cmus-tmux-statusbar.sh, force: true }
    ~/.cmus/cmus_add_similar.py:
      { create: true, path: cmus/cmus_add_similar.py, force: true }
    ~/.complete: { force: true, path: complete, create: true }
    ~/.config/alacritty: { create: true, force: true, path: config/alacritty/ }
    ~/.config/beets: { create: true, force: false, path: config/beets/ }
    ~/.config/cheat/conf.yml: { create: true, force: true, path: cheat.yml }
    ~/.config/cmus/autosave: { create: true, force: true, path: cmus/autosave }
    # ~/.config/digikamrc is handled by bin/link-manifest (machine-specific)
    ~/.config/gh: { create: true, force: true, path: config/gh/ }
    ~/.config/starship.toml: { create: true, force: true, path: config/starship.toml }
    ~/.config/ghostty/config:
      { create: true, force: true, path: config/ghostty/config }
    # Nextcloud/Joplin keep their own state in real ~/.config dirs; only config files are linked
    ~/.config/Nextcloud/sync-exclude.lst:
      { create: true, force: true, path: config/Nextcloud/sync-exclude.lst }
    ~/.config/nvim: { create: true, force: true, path: nvim/ }
    ~/.config/ranger: { create: true, force: true, path: config/ranger/ }
    ~/.config/rclone: { create: true, force: true, path: config/rclone/ }
    ~/.config/redlist: { create: true, force: true, path: config/redlist/ }
    ~/.config/terminator:
      { create: true, force: true, path: config/terminator/ }
    ~/.config/i3: { create: true, force: true, path: config/i3/ }
    ~/.config/autorandr: { create: true, force: true, path: config/autorandr/ }
    ~/.config/i3blocks: { create: true, force: true, path: config/i3blocks/ }
    ~/.config/rofi: { create: true, force: true, path: config/rofi/ }
    ~/.config/rmpc: { create: true, force: true, path: config/rmpc/ }
    ~/.config/yazi: { create: true, force: true, path: config/yazi/ }
    ~/.dotfiles: { force: true, path: ".", create: true }
    ~/.env: { force: true, path: env, create: true }
    ~/.flake8: { force: true, path: flake8, create: true }
    ~/.gitconfig: { create: true, force: true, path: gitconfig }
    ~/.gitignore: { force: true, path: gitignore, create: true }
    ~/.initsys.sh: { create: true, force: true, path: initsys.sh }
    ~/.local/share/applications/joplin.desktop:
      { create: true, force: true, path: desktop/joplin.desktop }
    ~/.local/share/applications/nextcloud.desktop:
      { create: true, force: true, path: desktop/nextcloud.desktop }
    ~/.local/share/applications/shotcut.desktop:
      { create: true, force: true, path: desktop/shotcut.desktop }
    ~/.local/share/applications/balena.desktop:
      { create: true, force: true, path: desktop/balena.desktop }
    ~/.local/share/applications/darktable.desktop:
      { create: true, force: true, path: desktop/darktable.desktop }
    ~/.local/share/applications/digikam.desktop:
      { create: true, force: true, path: desktop/digikam.desktop }
    ~/.myclirc: { create: true, force: true, path: myclirc }
    # ~/.p10k.zsh: { force: true, path: zsh/p10k.zsh }
    ~/.psqlrc: { force: true, path: psqlrc, create: true }
    ~/.screenlayout: { create: true, force: true, path: screenlayout }
    ~/.ssh/id_rsa.pub.pem:
      { create: true, force: true, path: ssh/id_rsa.pub.pem }
    ~/.ssh/id_rsa.pub: { create: true, force: true, path: ssh/id_rsa.pub }
    ~/.ssh/rc: { create: true, force: true, path: ssh/rc }
    ~/.tmux.conf.laptop: { force: true, path: tmux/tmux.conf.laptop }
    ~/.tmux.conf.termux: { force: true, path: tmux/tmux.conf.termux }
    ~/.tmux.conf.ssh: { force: true, path: tmux/tmux.conf.ssh }
    ~/.tmux.conf.ssh_laptop: { force: true, path: tmux/tmux.conf.ssh_laptop }
    ~/.tmux.conf: { force: true, path: tmux/tmux.conf }
    ~/.vimrc: { create: true, force: true, path: vim/vimrc }
    ~/.whatlastgenre: { create: true, force: false, path: whatlastgenre }
    ~/.xsessionrc: { force: true, path: xsessionrc }
    ~/.zsh_alias: { force: true, path: zsh_alias }
    # Profile files (new descriptive names)
    ~/.zshrc.laptop: { force: true, path: zsh/zshrc.laptop }
    ~/.zshrc.server: { force: true, path: zsh/zshrc.server }
    ~/.zshrc.homeserver: { force: true, path: zsh/zshrc.homeserver }
    # Legacy symlinks kept for backward compatibility
    ~/.zshrc.bfunk: { force: true, path: zsh/zshrc.homeserver }
    ~/.zshrc.local: { force: true, path: zsh/zshrc.laptop }
    ~/.zshrc.ssh: { force: true, path: zsh/zshrc.server }
    ~/.zshrc.common: { force: true, path: zsh/zshrc.common }
    ~/.zshrc.termux: { force: true, path: zsh/zshrc.termux }
    ~/.zshrc: { force: true, path: zsh/zshrc }
    ~/.zsh_functions: { force: true, path: zsh/functions }
    ~/.zsh_complete: { force: true, path: zsh/completions }
    ~/bin: { path: bin, create: true, force: true }
    ~/Mobac/mapsources: { path: mobac/mapsources, create: true, force: true }
- shell:
    - [chmod -R 0755 ~/.zsh_alias, Making SSH-folder read-only]
