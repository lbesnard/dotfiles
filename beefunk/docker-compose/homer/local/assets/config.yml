# Homepage configuration
title: "Beefunk Dashboard"
subtitle: "Local Services & Infrastructure"
header: true
footer: '<p>Created with <span class="has-text-danger">❤️</span>. Click on <a href="http://beefunk:3000/s/H1tA_LShH" target="_.local">Server How to</a> to understand how to get by.</p>'
connectivityCheck: true
theme: dark

# 3-column card grid layout
columns: 3

widgets:
  - type: "search"
    target: "_blank"
    provider: "duckduckgo"
  - type: "datetime"
    timezone: "Australia/Hobart"
    format: "YYYY-MM-DD HH:mm:ss"
  - type: "resources"
    cpu: true
    memory: true
    disk: "/"

colors:
  dark:
    highlight-primary: "#2b2b2b"
    highlight-secondary: "#484d54"
    highlight-hover: "#cfdfae"
    background: "#1313134a"
    card-background: "#2b2b2b"
    text: "#cadfae"
    text-header: "#cfdfae"
    text-title: "#cfdfae"
    text-subtitle: "#cfdfae"
    card-shadow: rgba(0, 0, 0, 0.4)
    link-hover: "#cfdfae"
  light:
    highlight-primary: "#2b2b2b"
    highlight-secondary: "#484d54"
    highlight-hover: "#cfdfae"
    background: "#1313134a"
    card-background: "#2b2b2b"
    text: "#cadfae"
    text-header: "#cfdfae"
    text-title: "#cfdfae"
    text-subtitle: "#cfdfae"
    card-shadow: rgba(0, 0, 0, 0.4)
    link-hover: "#cfdfae"

message:
  style: "is-warning"
  title: "Welcome to Beefunk!"
  content: '<a href="http://home.beefunk.local">http://home.beefunk.local</a> <br> Find more information about this media server at <a href="http://beefunk:3000/s/H1tA_LShH" target="_.local">Server How to</a>'

