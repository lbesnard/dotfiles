    #   - type: 'custom-search'
    #     options:
    #       placeholder: Search for something using the buttons below
    #       engines:
    #       - title: Quant
    #         url: https://www.qwant.com/?q=
      - type: clock
        options:
          timezone: Australia/Hobart

      - type: public-holidays
        options:
          country: AU
          state: TAS 
          holidayType: all
          monthsToShow: 2
          lang: en
      - type: xkcd-comic
