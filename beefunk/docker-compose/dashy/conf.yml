# Dashy Configuration - Converted from Homer config
# Full docs here: https://dashy.to/docs/configuring

pageInfo:
  title: Beefunk Dashboard
  description: Local Services & Infrastructure
  navLinks:
    - title: Server Howto
      path: https://hedgedoc.funkybrownfunk.duckdns.org/s/H1tA_LShH
      target: newtab
    - title: Brownfunk Homepage
      path: http://home.funkybrownfunk.duckdns.org
      target: newtab
    - title: Beefunk Homepage
      path: http://home.funkybeefunk.duckdns.org
      target: newtab
  footer: |
    Created with ❤️ | <a href="https://hedgedoc.funkybrownfunk.duckdns.org/s/H1tA_LShH" target="_blank">Server Howto</a>

appConfig:
  # theme: material-dark
  theme: nord
  statusCheck: true
  statusCheckInterval: 100
  statusCheckAccessibility: true
  pingCheckEnabled: true
  pingCheckInterval: 100
  pingCheckAccessibility: true
  defaultOpeningMethod: newtab
  language: en
  webSearch:
    searchEngine: 'duckduckgo'
    openingMethod: 'newtab'
    searchBangs:
      /r: reddit
      /w: wikipedia
      /s: https://whoogle.local/search?q=
      /a: https://www.amazon.co.uk/s?k=
      ':wolf': wolframalpha
      ':so': stackoverflow
      ':git': github



sections:
