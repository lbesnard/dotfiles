    network_mode: "host"
    privileged: true
    environment:
      - NFS_EXPORT_0={PICTURES_PATH} *(rw,async,no_subtree_check,no_root_squash)
    volumes:
      - ${PICTURES_PATH}:${PICTURES_PATH}
    ports:
      - "2049:2049"

  # Samba
  samba:
    image: dperson/samba
    container_name: samba
    depends_on:
      media-mount-check:
        condition: service_healthy
    environment:
      TZ: $TZ
      PUID: $PUID_USER
      PGID: $PGID_USER
    ports:
      - "139:139/tcp"
      - "445:445/tcp"
    read_only: true
    tmpfs:
      - /tmp
    restart: always
    stdin_open: true
    tty: true
    volumes:
      - $MOVIES_PATH:/share1:ro
      - $TV_SHOWS_PATH:/share2:ro
      - $SELF_IMPROVEMENT_PATH:/share3:ro
      - $PICTURES_EXPORT_PATH:/share4
      - $PICTURES_PATH:/share5
      - $MUSIC_PATH:/share6
      - $SWITCH_PATH:/share7
    command: |
      -s "Movies;/share1;yes;yes;yes;all;none;$USER;movies share ro"
      -s "Shows;/share2;yes;yes;yes;all;none;$USER;shows share ro"
      -s "Self Improvement;/share3;yes;no;no;$USER;$USER;$USER;Self Improvement share ro"
      -s "Pictures_export;/share4;yes;no;no;$USER;$USER;$USER;pictures_export ro except user"
      -s "Pictures;/share5;yes;no;no;$USER;$USER;$USER;pictures ro except user"
      -s "Music;/share6;yes;yes;yes;all;none;$USER;music share ro"
      -s "Switch;/share7;yes;yes;yes;all;none;$USER;switch share ro"
      -u "$USER;$SAMBA_PASSWORD"
      -u "guest;guest"
      -g "map to guest = Bad User"
      -g "guest account = nobody"

