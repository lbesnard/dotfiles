      KIOSK_IMMICH_URL: "http://immich.beefunk.local"     
      KIOSK_IMMICH_API_KEY: $IMMICH_KIOSK_API
    volumes:
      - ./immich-kiosk/config:/config
    restart: always
    healthcheck:
      test: ["CMD", "/kiosk", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich-kiosk.rule=Host(`immich-kiosk.beefunk.lan`) || Host(`immich-kiosk.beefunk.home`) || Host(`immich-kiosk.beefunk.local`) || Host(`immich-kiosk.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.immich-kiosk.entrypoints=websecure"
      - "traefik.http.routers.immich-kiosk.tls=true"
      - "traefik.http.services.immich-kiosk.loadbalancer.server.port=3000"
  digikam:
    container_name: digikam
    image: lscr.io/linuxserver/digikam:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=$TZ
      - PIXELFLUX_WAYLAND=true
      - DRINODE=/dev/dri/renderD128
      - DRI_NODE=/dev/dri/renderD128
      # Optional authentication:
      # - CUSTOM_USER=$USER
      # - PASSWORD=$DIGIKAM_PASSWORD
      - NO_DECOR=true
      # - NO_GAMEPAD=true
      # - SELKIES_IS_MANUAL_RESOLUTION_MODE=true
      # - SELKIES_MANUAL_WIDTH=1920
      # - SELKIES_MANUAL_HEIGHT=1080
      # - AUTO_GPU=true
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - $PICTURES_PATH/Digikam_linuxserver:/config
      - $PICTURES_PATH/Pictures:/photos
    # ports:
      # - "3001:3001"
    shm_size: "2gb"
    dns:
      - $BEEFUNK_LOCAL_IP
    depends_on:
      - pihole
    restart: unless-stopped
    networks:
      - proxy
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.digikam.rule=Host(`digikam.beefunk.lan`) || Host(`digikam.beefunk.home`) || Host(`digikam.beefunk.local`) || Host(`digikam.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.digikam.entrypoints=websecure"
      - "traefik.http.routers.digikam.tls=true"
      - "traefik.http.routers.digikam.middlewares=digikam-ws"


      # - "traefik.http.services.digikam.loadbalancer.server.port=3000"
      - "traefik.http.services.digikam.loadbalancer.server.port=3001"
      - "traefik.http.services.digikam.loadbalancer.server.scheme=https"
      - "traefik.http.services.digikam.loadbalancer.serverstransport=digikam-tls@file"

      - "traefik.http.middlewares.digikam-ws.headers.customrequestheaders.Connection=upgrade"
      - "traefik.http.middlewares.digikam-ws.headers.customrequestheaders.Upgrade=websocket"

      - "com.centurylinklabs.watchtower.enable=true"

  darktable:
    container_name: darktable
    image: lscr.io/linuxserver/darktable:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=$TZ
      # Change to false to force stable X11 pipeline for GTK3 / Darktable
      - PIXELFLUX_WAYLAND=false 
      - DRINODE=/dev/dri/renderD128
      - DRI_NODE=/dev/dri/renderD128
      - NO_DECOR=true
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - $PICTURES_PATH/Pictures:/Pictures
      - $PICTURES_PATH/Export:/Export
      - $PICTURES_PATH/darktable_docker_config:/config
    shm_size: "4gb"
    dns:
      - $BEEFUNK_LOCAL_IP
      - 8.8.8.8
    depends_on:
      - pihole
    restart: unless-stopped
    networks:
      - proxy
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.darktable.rule=Host(`darktable.beefunk.lan`) || Host(`darktable.beefunk.home`) || Host(`darktable.beefunk.local`) || Host(`darktable.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.darktable.entrypoints=websecure"
      - "traefik.http.routers.darktable.tls=true"


      - "traefik.http.services.darktable.loadbalancer.server.port=3000"
      - "traefik.http.services.darktable.loadbalancer.server.scheme=https"
      - "traefik.http.services.darktable.loadbalancer.serverstransport=darktable-tls@file"

      - "com.centurylinklabs.watchtower.enable=true"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    #container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=$TZ
      - AUTO_UPDATE=true #optional
      - WATCHTOWER_CLEANUP=true
    volumes:
      - $DOCKER_CONFIG_PATH/prowlarr:/config
    #    ports:
    #      - 9696:9696
    dns:
      - $PIHOLE_DOCKER_SUB_IP_DNS
    depends_on:
      - pihole
    restart: unless-stopped
    networks:
      - proxy
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.beefunk.lan`) || Host(`prowlarr.beefunk.home`) || Host(`prowlarr.beefunk.local`) || Host(`prowlarr.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "com.centurylinklabs.watchtower.enable=true"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - PUID=$PUID_USER
      - PGID=$PGID_USER
      - TZ=$TZ
      - WATCHTOWER_CLEANUP=true
    dns:
      - 1.1.1.1
      - 8.8.8.8
    shm_size: "2gb" # Recommended for Chromium stability in Docker
    ports:
      - 8191:8191
    networks:
      - proxy
      - frontend # Ensure this matches the network Prowlarr is on
    depends_on:
      - pihole
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.beefunk.lan`) || Host(`flaresolverr.beefunk.home`) || Host(`flaresolverr.beefunk.local`) || Host(`flaresolverr.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.flaresolverr.entrypoints=websecure"
      - "traefik.http.routers.flaresolverr.tls=true"
      - "traefik.http.services.flaresolverr.loadbalancer.server.port=8191"
      - "com.centurylinklabs.watchtower.enable=true"
  netdata:
    image: netdata/netdata
    container_name: netdata
    hostname: $SERVER_URL # set to fqdn of host
    #    ports:
    #      - 19999:19999
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=$PUID_USER
      - PGID=996
      - TZ=$TZ
      - WATCHTOWER_CLEANUP=true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netdata.rule=Host(`netdata.beefunk.lan`) || Host(`netdata.beefunk.home`) || Host(`netdata.beefunk.local`) || Host(`netdata.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.netdata.entrypoints=websecure"
      - "traefik.http.routers.netdata.tls=true"
      - "traefik.http.services.netdata.loadbalancer.server.port=19999"
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  netdatalib:
  netdatacache:
  moode_mnt_nfs:
      driver: local
      driver_opts:
        type: nfs
        o: "addr=${MOODE_AUDIO_LOCAL_IP},nfsvers=4,rw,nolock,soft,timeo=10"
        device: ":/mnt/"

  moode_mpd_nfs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${MOODE_AUDIO_LOCAL_IP},nfsvers=4,rw,nolock,soft,timeo=10"
      device: ":/var/lib/mpd/"
