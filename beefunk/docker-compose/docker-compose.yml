networks:
  proxy:
    driver: bridge # created auto my docker
    # external: true
  frontend:
    ipam:
      config:
        - subnet: $DOCKER_SUBNET_1

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
      # Global HTTP->HTTPS redirect: every router on `web` is redirected to
      # `websecure`, so individual services no longer need a redirect middleware.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --providers.file.filename=/etc/traefik/dynamic_tls.yml
      - --api.dashboard=true
      # Let's Encrypt wildcard cert for *.$DUCKDNS_DOMAIN.duckdns.org via DNS-01.
      # DNS-01 is outbound only: traefik sets a TXT record through the DuckDNS API
      # and Let's Encrypt reads it from public DNS. No inbound ports are needed.
      - --certificatesresolvers.duckdns.acme.dnschallenge=true
      - --certificatesresolvers.duckdns.acme.dnschallenge.provider=duckdns
      # This container cannot reach DuckDNS's authoritative nameservers on UDP/53,
      # so lego's own propagation check times out. Skip it and simply wait instead -
      # Let's Encrypt still validates the TXT record itself from the internet.
      - --certificatesresolvers.duckdns.acme.dnschallenge.disablepropagationcheck=true
      - --certificatesresolvers.duckdns.acme.dnschallenge.delaybeforecheck=120
      - --certificatesresolvers.duckdns.acme.email=$ACME_EMAIL
      - --certificatesresolvers.duckdns.acme.storage=/acme/acme.json
    ports:
      - "80:80"
      - "443:443"
    dns:
      - $BEEFUNK_LOCAL_IP
      - 1.1.1.1
    environment:
      - DUCKDNS_TOKEN=$DUCKDNS_TOKEN
    volumes:
      # Self-signed fallback for the *.beefunk.local / .lan / .home names.
      # CREATE CERTS WITH FOLLOWING COMMAND
      # openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
      #   -keyout beefunk.key -out beefunk.crt \
      #   -subj "/CN=beefunk.local" \
      #   -addext "subjectAltName=DNS:beefunk.local,DNS:*.beefunk.local,DNS:beefunk.home,DNS:*.beefunk.home,DNS:beefunk.lan,DNS:*.beefunk.lan"
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/certs:/certs:ro # mount cert folder
      - ./traefik/acme:/acme # acme.json, must stay writable
      - ./traefik/dynamic_tls.yml:/etc/traefik/dynamic_tls.yml:ro
    networks:
      - proxy
      - frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # This single router requests the wildcard cert. Every other router just
      # sets tls=true and traefik serves the matching cert from its store:
      # *.duckdns.org names get the Let's Encrypt wildcard, *.local names get
      # the self-signed default from dynamic_tls.yml.
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=duckdns"
      - "traefik.http.routers.traefik-dashboard.tls.domains[0].main=$DUCKDNS_DOMAIN.duckdns.org"
      - "traefik.http.routers.traefik-dashboard.tls.domains[0].sans=*.$DUCKDNS_DOMAIN.duckdns.org"

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      # - "8002:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      # - "455:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      # - "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: $TZ
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: $PIHOLE_PWD
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
      FTLCONF_dns_listeningMode: "all"

      # FTLCONF_LOCAL_IPV4: 192.168.1.100
    # Volumes store your data between container upgrades
    volumes:
      # For persisting Pi-hole's databases and common configuration file
      - $DOCKER_CONFIG_PATH/pihole/etc/pihole/:/etc/pihole/
      - $DOCKER_CONFIG_PATH/pihole/etc-dnsmasq.d/:/etc/dnsmasq.d/
      # Uncomment the below if you have custom dnsmasq config files that you want to persist. Not needed for most starting fresh with Pi-hole v6. If you're upgrading from v5 you and have used this directory before, you should keep it enabled for the first v6 container start to allow for a complete migration. It can be removed afterwards. Needs environment variable FTLCONF_misc_etc_dnsmasq_d: 'true'
      #- './etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      # - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      # - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.beefunk.lan`) || Host(`pihole.beefunk.home`) || Host(`pihole.beefunk.local`) || Host(`pihole.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.services.pihole.loadbalancer.server.port=80" # <--- internal port


    networks:
      proxy: {}
      frontend:
        ipv4_address: $PIHOLE_DOCKER_SUB_IP_DNS
    restart: always
  #
  wireguard2:
    image: linuxserver/wireguard
    container_name: wireguard2
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=$PUID_USER
      - PGID=$PGID_USER
      - TZ=$TZ
      # - SERVERURL=${DUCKDNS_DOMAIN}.duckdns.org
      - SERVERURL=$GLDDNS_URL}
      - SERVERPORT=51820 #optional
      - PEERS=$WG2_PEERS #optional
      # - PEERDNS=$PIHOLE_DOCKER_SUB_IP_DNS #using pihole docker, default port is 53, which is dsn by default # docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' pihole
      - PEERDNS=$BEEFUNK_LOCAL_IP
      - INTERNAL_SUBNET=10.13.13.0 #optional
    volumes:
      - $DOCKER_CONFIG_PATH/wireguard2/config:/config
      - /lib/modules:/lib/modules
      - /usr/src/:/usr/src
    depends_on:
      - pihole
    ports:
      - 51820:51820/udp
    networks:
      - frontend
      - proxy
    #sysctls:
    #- net.ipv4.conf.all.src_valid_mark=1
    restart: always

  homer:
    image: b4bz/homer:latest
    container_name: homer
    environment:
      - PUID=$PUID_USER
      - PGID=$PGID_USER
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
    volumes:
      # - $DOCKER_CONFIG_PATH/homer/config.yml:/www/config.yml
      # - $DOCKER_CONFIG_PATH/homer/local/assets/:/www/assets
      - ./homer/config.yml:/www/config.yml
      - ./homer/local/assets/:/www/assets
    # ports:
    # - 80:8080
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homer.rule=Host(`home.beefunk.lan`) || Host(`home.beefunk.home`) || Host(`home.beefunk.local`) || Host(`home.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.homer.entrypoints=websecure"
      - "traefik.http.routers.homer.tls=true"
      - "traefik.http.services.homer.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=true"

      # Watchtower
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      - pihole
      - traefik

  media-mount-check:
    image: busybox:latest
    container_name: media-mount-check
    volumes:
      - /proc:/host-proc:ro
    command: ["sh", "-c", "while true; do sleep 30; done"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -q ' $MOUNT_CHECK ' /host-proc/1/mountinfo"
        ]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 2s
  #
