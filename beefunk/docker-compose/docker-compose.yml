      - DB_NAME=${ROMM_DB_NAME}
      - DB_USER=${ROMM_DB_USER}
      - DB_PASSWD=${ROMM_DB_PASS}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET}
      - SCREENSCRAPER_USER=${SCREENSCRAPER_USER}
      - SCREENSCRAPER_PASSWORD=${SCREENSCRAPER_PASS}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY}
      - SCAN_WORKERS=8
      - ENABLE_RESCAN_ON_FILESYSTEM_CHANGE=true
      - ENABLE_SCHEDULED_RESCAN=true
      - SCHEDULED_RESCAN_CRON=0 */4 * * *
    dns:
      - $BEEFUNK_LOCAL_IP
      - 8.8.8.8
    volumes:
