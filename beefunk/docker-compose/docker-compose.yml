    image: busybox:latest
    container_name: moode-check
    networks:
      - proxy
    dns:
      - $BEEFUNK_LOCAL_IP
      - 192.168.8.1
      - 8.8.8.8
    command: ["sh", "-c", "while true; do sleep 30; done"]
    healthcheck:
      test: ["CMD", "ping", "-c", "1", "-W", "2", "moode.local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  mympd:
    image: ghcr.io/jcorporation/mympd/mympd
    container_name: mympd
    # ports:
    # - 8097:8080
    # - 8443:8443
    user: 1000:1000
    environment:
      TZ: $TZ
      MYMPD_SSL_SAN: "DNS:beefunk,IP:192.168.8.x"
      MYMPD_MYMPD_URI: https://mympd.beefunk.local
      # MYMPD_MYMPD_URI: http://beefunk:8097
      MYMPD_LOGLEVEL: 7
    # depends_on:
      # - sshfs-moode-mpd
      # - sshfs-moode-mnt
    volumes:
      - /run/mpd:/run/mpd
      - moode_mpd_nfs:/var/lib/mpd:ro
      - moode_mnt_nfs:/mnt:ro
      # - $MUSIC_PATH:/var/lib/mpd/music:ro
      - $MUSIC_PATH:/mnt/NAS/beefunkMusic:ro
      - $DOCKER_CONFIG_PATH/mympd/workdir:/var/lib/mympd
      - $DOCKER_CONFIG_PATH/mympd/cachedir:/var/cache/mympd
      ## Optional for myGPIOd support
      ## - /run/mygpiod:/run/mygpiod
      # - /docker/mympd/workdir:/var/lib/mympd
      # - /docker/mympd/cachedir:/var/cache/mympd
      # - $DOCKER_CONFIG_PATH/moode_mpd/music:/var/lib/mpd/music:ro
      # - $DOCKER_CONFIG_PATH/moode_mpd/playlists:/var/lib/mpd/playlists:ro
      # - $DOCKER_CONFIG_PATH/moode_mount/:/mnt:ro
      # # - /var/lib/mpd/playlists:/var/lib/mpd/playlists:ro
      # - $DOCKER_CONFIG_PATH/mympd/workdir:/var/lib/mympd
      # - $DOCKER_CONFIG_PATH/mympd/cachedir:/var/cache/mympd
      # - $DOCKER_CONFIG_PATH/mympd/lib/mpd/music:/var/lib/mpd/music:ro
      # - $DOCKER_CONFIG_PATH/mympd/var/lib/mpd/playlists:/var/lib/mpd/playlists:ro
      #
      #
    mem_limit: 812m
    memswap_limit: 812m
    cpuset: "0"
    pids_limit: 256
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mympd.rule=Host(`mympd.beefunk.lan`) || Host(`mympd.beefunk.home`) || Host(`mympd.beefunk.local`) || Host(`mympd.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.mympd.entrypoints=websecure"
      - "traefik.http.routers.mympd.tls=true"
      - "traefik.http.services.mympd.loadbalancer.server.port=8080"
