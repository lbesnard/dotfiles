      - "traefik.http.routers.unmanic.rule=Host(`unmanic.beefunk.lan`) || Host(`unmanic.beefunk.home`) || Host(`unmanic.beefunk.local`) || Host(`unmanic.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.unmanic.entrypoints=websecure"
      - "traefik.http.routers.unmanic.tls=true"
      - "traefik.http.services.unmanic.loadbalancer.server.port=8888"
