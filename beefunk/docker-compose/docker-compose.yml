  jellyfin:
    image: linuxserver/jellyfin
    container_name: jellyfin
    depends_on:
      media-mount-check:
        condition: service_healthy
    environment:
      - PUID=$PUID_USER
      - PGID=$PGID_USER
      - TZ=${TZ}
      - UMASK=022 #optional
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
      - WATCHTOWER_CLEANUP=true
    volumes:
      - $DOCKER_CONFIG_PATH/jellyfin:/config
      - ${TV_SHOWS_PATH}:/data/tvshows:ro
      - $MOVIES_PATH:/data/movies:ro
      - $MOVIES_FR_PATH:/data/movies_french:ro
      - $MOVIES_SPORT_PATH:/data/movies_adventure_sports:ro
      - $YOGA_GLO_PATH:/data/yoga_glo:ro
      - $GUITAR_VIDEOS_PATH:/data/guitar:ro
      - /dev/dri:/dev/dri #optional
    # ports:
    #   - 8096:8096 #http
    #   - 8920:8920 #https
    #   - 7359:7359/udp #optional
    #   - 1900:1900/udp #optional
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.beefunk.lan`) || Host(`jellyfin.beefunk.home`) || Host(`jellyfin.beefunk.local`) || Host(`jellyfin.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      - "com.centurylinklabs.watchtower.enable=true"
  ###########################
  navidrome:
    image: deluan/navidrome
    container_name: navidrome
    depends_on:
      media-mount-check:
        condition: service_healthy
    user: $PUID_USER:$PGID_USER # should be owner of volumes
    dns:
      - $BEEFUNK_LOCAL_IP
      - 8.8.8.8
    #    ports:
    #      - "8080:4533"
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.navidrome.rule=Host(`navidrome.beefunk.lan`) || Host(`navidrome.beefunk.home`) || Host(`navidrome.beefunk.local`) || Host(`navidrome.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.navidrome.entrypoints=websecure"
      - "traefik.http.routers.navidrome.tls=true"
      - "traefik.http.services.navidrome.loadbalancer.server.port=4533"
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      # Optional: put your config options customization here. Examples:
      ND_PLUGINS_ENABLED: "true"
      ND_PLUGINS_AUTORELOAD: "true"
      ND_AGENTS: "audiomuseai,lastfm" # Note 'audiomuseai' is added here
      ND_DEVARTISTINFOTIMETOLIVE: "1s" # Recommended by the dev for responsiveness
      ND_SCANINTERVAL: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
      ND_MUSICFOLDER: "/music"
