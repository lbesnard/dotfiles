      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - $DOCKER_CONFIG_PATH/pyload-ng/config:/config
      - $PYLOAD_DL_PATH:/downloads
    dns:
      - 8.8.8.8
      - $BEEFUNK_LOCAL_IP
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pyload.rule=Host(`pyload.beefunk.lan`) || Host(`pyload.beefunk.home`) || Host(`pyload.beefunk.local`) || Host(`pyload.$DUCKDNS_DOMAIN.duckdns.org`)"
      - "traefik.http.routers.pyload.entrypoints=websecure"
      - "traefik.http.routers.pyload.tls=true"
      - "traefik.http.services.pyload.loadbalancer.server.port=8000"
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped


    # ports:
      # - 8000:8000
      # - 9666:9666 #optional
  unmanic:
    container_name: unmanic
    image: josh5/unmanic:latest
    restart: unless-stopped
    environment:
      - PUID=$PUID_USER
      - PGID=$PGID_USER
    dns:
      - 8.8.8.8
      - $BEEFUNK_LOCAL_IP
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - $DOCKER_CONFIG_PATH/unmanic:/config
      - $TV_SHOWS_PATH:/library_shows
      - /tmp/unmanic:/tmp/unmanic
    # ports:
      # - 8877:8888
