# Global mise config: CLI tools for any machine, no sudo needed.
# Linked to ~/.config/mise/config.toml by dotbot; installed with `mise install` (see bin/mise-bootstrap).
# Add a tool:  mise use -g <tool>   (edits this file through the symlink)   Upgrade: mise upgrade
# Find a name: mise registry | grep <name>   or use a backend directly: aqua:owner/repo, github:owner/repo, pipx:pkg
#
# NOT here (need compiling or system libs; use apt / the distro): zsh (see bin/mise-bootstrap), git, tig, vim,
#   htop, ncdu, tree, xclip, openssh, curl, coreutils, p7zip, gcc, cmake, midnight-commander, urlview, grc, fpp,
#   pyenv, rbenv, ruby, ansible (pinned/managed by Fleet-Control), ffmpeg (no reliable prebuilt; GitHub API
#   rate limit), thefuck (broken on current Python), nmap, mtr, whois, strace, screen, sshfs.

[tools]
# shell
tmux = "latest"
starship = "latest"
zoxide = "latest"
fzf = "latest"
"aqua:skim-rs/skim" = "latest"        # sk

# editor
"aqua:neovim/neovim" = "latest"

